<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6750a4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a82db;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="400" fill="url(#grid)"/>
  
  <!-- Main content area -->
  <rect x="50" y="50" width="700" height="300" rx="16" fill="white" opacity="0.95"/>
  
  <!-- Header -->
  <rect x="50" y="50" width="700" height="60" rx="16" fill="#f5f5f5"/>
  <rect x="50" y="94" width="700" height="16" fill="#f5f5f5"/>
  <circle cx="80" cy="80" r="12" fill="#6750a4"/>
  <rect x="100" y="72" width="80" height="16" rx="4" fill="#6750a4"/>
  
  <!-- Navigation -->
  <rect x="620" y="72" width="40" height="16" rx="4" fill="#666"/>
  <rect x="670" y="72" width="40" height="16" rx="4" fill="#666"/>
  <rect x="720" y="72" width="40" height="16" rx="4" fill="#666"/>
  
  <!-- Hero section -->
  <rect x="80" y="130" width="300" height="32" rx="4" fill="#1a1a1a"/>
  <rect x="80" y="170" width="200" height="16" rx="4" fill="#666"/>
  
  <!-- Cards -->
  <rect x="80" y="210" width="200" height="120" rx="8" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="300" y="210" width="200" height="120" rx="8" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="520" y="210" width="200" height="120" rx="8" fill="#f9f9f9" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Card content -->
  <rect x="100" y="230" width="160" height="12" rx="2" fill="#666"/>
  <rect x="100" y="250" width="120" height="8" rx="2" fill="#999"/>
  <rect x="100" y="270" width="140" height="8" rx="2" fill="#999"/>
  <rect x="100" y="290" width="100" height="8" rx="2" fill="#999"/>
  
  <rect x="320" y="230" width="160" height="12" rx="2" fill="#666"/>
  <rect x="320" y="250" width="120" height="8" rx="2" fill="#999"/>
  <rect x="320" y="270" width="140" height="8" rx="2" fill="#999"/>
  <rect x="320" y="290" width="100" height="8" rx="2" fill="#999"/>
  
  <rect x="540" y="230" width="160" height="12" rx="2" fill="#666"/>
  <rect x="540" y="250" width="120" height="8" rx="2" fill="#999"/>
  <rect x="540" y="270" width="140" height="8" rx="2" fill="#999"/>
  <rect x="540" y="290" width="100" height="8" rx="2" fill="#999"/>
  
  <!-- Text -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.8)" text-anchor="middle">Haprial Blog Theme • Material Design 3</text>
</svg>
