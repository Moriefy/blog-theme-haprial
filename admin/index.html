<!-- 登录页 -->
<div id="loginPage" class="login-page">

    <div id="loginError" class="error"></div>

      <input class="md3-input" type="password" id="loginPassword" placeholder="管理密码" autocomplete="current-password" style="margin-bottom:16px">
      <button class="md3-btn md3-btn-filled" type="submit" style="width:100%;justify-content:center" id="loginBtn">登录</button>
    </form>
  </div>
</div>
