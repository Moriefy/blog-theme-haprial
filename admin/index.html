<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 | Haprial</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginPage" class="login-page">
  <div class="login-card">
    <h1>🔐 管理后台</h1>
    <p>输入密码登录 Haprial 博客管理系统</p>
    <div id="loginError" class="error"></div>
    <form id="loginForm">
      <input class="md3-input" type="password" id="loginPassword" placeholder="管理密码" autocomplete="current-password" style="margin-bottom:16px">
      <button class="md3-btn md3-btn-filled" type="submit" style="width:100%;justify-content:center">登录</button>
    </form>
  </div>
</div>
<div id="app" class="app" style="display:none">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">Haprial 管理</div>
    <div class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>仪表盘</button>
      <button class="nav-item" data-page="articles"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>文章管理</button>
      <button class="nav-item" data-page="editor"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>写文章</button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-page="comments"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>评论管理</button>
      <button class="nav-item" data-page="friends"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>友链管理</button>
      <div class="nav-sep"></div>
      <button class="nav-item" data-page="trash"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>回收站</button>
    </div>
    <div class="sidebar-footer">
      <button class="nav-item" id="logoutBtn"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</button>
    </div>
  </nav>
  <nav class="mobile-tabs" id="mobileTabs">
    <button class="nav-item active" data-page="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>首页</button>
    <button class="nav-item" data-page="articles"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>文章</button>
    <button class="nav-item" data-page="editor"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>写文</button>
    <button class="nav-item" data-page="comments"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>评论</button>
    <button class="nav-item" data-page="friends"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>友链</button>
  </nav>
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="pageTitle">仪表盘</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="dialog-overlay" id="dialogOverlay"><div class="dialog" id="dialog"></div></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
